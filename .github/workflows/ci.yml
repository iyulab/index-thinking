name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - '*.slnx'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to NuGet.org'
        required: false
        default: 'false'
        type: boolean

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing by default; every job below asks for what it needs.
permissions: {}

# The push to nuget.org is not made here. The `pack` job builds and packs, uploads the packages as an artifact and the `publish` job asks the
# organization's central publisher (iyulab/nuget-publish) to push them; that repository holds the only trusted-publishing policy
# and checks this repository, this workflow file and the package ids against an allowlist. No NuGet credential lives here.
# The pack, publish and release jobs never run on a pull request (the central publisher refuses such a run).
jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore src/IndexThinking/IndexThinking.csproj
          dotnet restore tests/IndexThinking.Tests/IndexThinking.Tests.csproj
          dotnet restore tests/IndexThinking.IntegrationTests/IndexThinking.IntegrationTests.csproj

      - name: Build
        run: |
          dotnet build src/IndexThinking/IndexThinking.csproj --no-restore --configuration Release
          dotnet build tests/IndexThinking.Tests/IndexThinking.Tests.csproj --no-restore --configuration Release
          dotnet build tests/IndexThinking.IntegrationTests/IndexThinking.IntegrationTests.csproj --no-restore --configuration Release

      - name: Test
        # --report-trx/--report-trx-filename and --hangdump/--hangdump-timeout are MTP's
        # equivalents of VSTest's --logger trx and --blame-hang (native MTP mode via global.json
        # needs no -- separator before these flags).
        run: |
          dotnet test --project tests/IndexThinking.Tests/IndexThinking.Tests.csproj --no-build --configuration Release --verbosity normal --report-trx --report-trx-filename test-results.trx --hangdump --hangdump-timeout 5m
          dotnet test --project tests/IndexThinking.IntegrationTests/IndexThinking.IntegrationTests.csproj --no-build --configuration Release --verbosity normal --report-trx --report-trx-filename test-results.trx --hangdump --hangdump-timeout 5m

  pack:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Build Release
        run: |
          dotnet build src/IndexThinking/IndexThinking.csproj --configuration Release

      - name: Pack NuGet packages
        run: |
          dotnet pack src/IndexThinking/IndexThinking.csproj --configuration Release --no-build --output ./nupkgs

      - name: List packages
        run: ls -la ./nupkgs

      # This workflow runs on every push to main that touches the sources, and the old push skipped a version nuget.org already had.
      # The central call is not free, so ask nuget.org first: hand the package over only when this version is not there yet.
      - name: Decide whether to publish
        id: decide
        run: |
          version="${{ steps.version.outputs.version }}"
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/indexthinking/${version,,}/indexthinking.${version,,}.nupkg")
          if [ "$status" != "200" ]; then
            echo "IndexThinking ${version} is not on nuget.org (HTTP ${status}) - publish"
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "IndexThinking ${version} is already on nuget.org"
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      # Only .nupkg and .snupkg files: the central publisher refuses an artifact that holds anything else.
      - name: Upload packages
        if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
          if-no-files-found: error
          retention-days: 1

  # Asks the central publisher to push the packages and waits for its answer: this job succeeds only when they are on nuget.org.
  # Until the repository is on the publisher's allowlist the call is refused and the jobs after it do not run.
  publish:
    needs: pack
    if: ${{ needs.pack.outputs.publish == 'true' }}
    uses: iyulab/nuget-publish/.github/workflows/request.yml@2166748abf716fb58855228f65fc6b8f78c2780f # main
    permissions: {}
    secrets: inherit

  # The tag and the GitHub release exist only for a version that reached nuget.org.
  release:
    needs: [pack, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # tag + GitHub release
    steps:
      - uses: actions/checkout@v5

      # Release notes = this version's CHANGELOG.md section. Every iyulab publish workflow carries this awk program
      # verbatim; change it in all of them or in none.
      - name: GitHub release (notes = this version's CHANGELOG section)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP '<(Version|VersionPrefix)>\K[^<]+' Directory.Build.props | head -1)
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Release v$VERSION already exists"; exit 0; fi
          awk -v v="$VERSION" '/^## /{if(p)exit;h=$0;sub(/^## +\[?v?/,"",h);c=substr(h,length(v)+1,1);if(index(h,v)==1&&(c==""||c=="]"||c==" "||c=="\t")){p=1;next}}p&&(n||$0!~/^[ \t]*$/){l[++n]=$0}END{while(n&&(l[n]~/^[ \t]*$/||l[n]~/^---+$/))n--;for(i=1;i<=n;i++)print l[i]}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; fi
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"
