name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'Directory.Build.props'
      - 'src/**'
      - 'tests/**'
      - '*.slnx'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to NuGet.org'
        required: false
        default: 'false'
        type: boolean

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore src/IndexThinking/IndexThinking.csproj
          dotnet restore tests/IndexThinking.Tests/IndexThinking.Tests.csproj
          dotnet restore tests/IndexThinking.IntegrationTests/IndexThinking.IntegrationTests.csproj

      - name: Build
        run: |
          dotnet build src/IndexThinking/IndexThinking.csproj --no-restore --configuration Release
          dotnet build tests/IndexThinking.Tests/IndexThinking.Tests.csproj --no-restore --configuration Release
          dotnet build tests/IndexThinking.IntegrationTests/IndexThinking.IntegrationTests.csproj --no-restore --configuration Release

      - name: Test
        # --report-trx/--report-trx-filename and --hangdump/--hangdump-timeout are MTP's
        # equivalents of VSTest's --logger trx and --blame-hang (native MTP mode via global.json
        # needs no -- separator before these flags).
        run: |
          dotnet test tests/IndexThinking.Tests/IndexThinking.Tests.csproj --no-build --configuration Release --verbosity normal --report-trx --report-trx-filename test-results.trx --hangdump --hangdump-timeout 5m
          dotnet test tests/IndexThinking.IntegrationTests/IndexThinking.IntegrationTests.csproj --no-build --configuration Release --verbosity normal --report-trx --report-trx-filename test-results.trx --hangdump --hangdump-timeout 5m


  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Build Release
        run: |
          dotnet build src/IndexThinking/IndexThinking.csproj --configuration Release

      - name: Pack NuGet packages
        run: |
          dotnet pack src/IndexThinking/IndexThinking.csproj --configuration Release --no-build --output ./nupkgs

      - name: List packages
        run: ls -la ./nupkgs

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
